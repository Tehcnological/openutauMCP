# On a version tag (e.g. v0.2.0): build the single-file exe (plugin inside) and the plugin DLL against OpenUtau
# 0.1.576, check the exe answers over stdio, attach both to a DRAFT release. Nothing is public until the draft is
# published by hand on GitHub.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Get OpenUtau 0.1.576 to compile the plugin against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.1.576 -R stakira/OpenUtau -p OpenUtau-win-x64.zip -D .build
          Expand-Archive .build\OpenUtau-win-x64.zip .build\OpenUtau
          $dir = (Get-ChildItem .build\OpenUtau -Recurse -Filter OpenUtau.Core.dll | Select-Object -First 1).DirectoryName
          "OPENUTAU_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build dist\openutau-mcp.exe and dist\OpenUtauMcp.Plugin.dll
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -OpenUtauDir $env:OPENUTAU_DIR
      - name: Check the exe starts and every tool schema passes
        run: |
          uv venv -p 3.11 .build\check
          uv pip install -p .build\check "mcp>=1.9,<2"
          .build\check\Scripts\python tests\schema_check.py dist\openutau-mcp.exe
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\openutau-mcp.exe dist\OpenUtauMcp.Plugin.dll dist\SHA256SUMS.txt dist\openutau-mcp-packages.txt --draft --generate-notes
