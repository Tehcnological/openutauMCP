# On a version tag (e.g. v0.4.0): build the single-file exe (plugin inside) and the plugin DLL against OpenUtau
# 0.1.576, check the exe answers over stdio, attach both to a DRAFT release. Nothing is public until the draft is
# published by hand on GitHub.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # Picks the self-hosted runner only when the repo variable SELF_HOSTED is 'on', Tehcnological started the run
  # (never a fork PR or anyone else), and the machine is online and idle. Otherwise the GitHub-hosted runner, as before,
  # so a job never waits on a machine that is off. RUNNER_STATUS_TOKEN is a fine-grained PAT with only
  # Administration: read on this repo. The runner re-checks the same rules in its own job-started hook.
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          TRUSTED: ${{ vars.SELF_HOSTED == 'on' && github.repository_owner == 'Tehcnological' && github.actor == 'Tehcnological' && github.triggering_actor == 'Tehcnological' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: |
          idle() { [ "$TRUSTED" = true ] && [ -n "$GH_TOKEN" ] && [ "$(timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/runners" --jq "[.runners[] | select(.status == \"online\" and (.busy | not) and any(.labels[]; .name == \"$1\"))] | length" 2>/dev/null || echo 0)" -gt 0 ] 2>/dev/null; }
          if idle cmd1; then echo 'windows=["self-hosted","cmd1","windows","x64"]'; else echo 'windows="windows-latest"'; fi >> "$GITHUB_OUTPUT"

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.windows) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check the tag matches the version in the code
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $init = (Select-String -Path src\*\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $dll = (Select-String -Path plugin\OpenUtauMcp.Plugin.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          if ("v$py" -ne $env:GITHUB_REF_NAME -or $py -ne $init -or $py -ne $dll) {
            throw "tag $env:GITHUB_REF_NAME, pyproject.toml $py, __init__.py $init and the plugin csproj $dll must match"
          }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: "10.0.x"
      - name: Get OpenUtau 0.1.576 to compile the plugin against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.1.576 -R stakira/OpenUtau -p OpenUtau-win-x64.zip -D .build
          Expand-Archive .build\OpenUtau-win-x64.zip .build\OpenUtau
          $dir = (Get-ChildItem .build\OpenUtau -Recurse -Filter OpenUtau.Core.dll | Select-Object -First 1).DirectoryName
          "OPENUTAU_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build dist\openutau-mcp.exe and dist\OpenUtauMcp.Plugin.dll
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -OpenUtauDir $env:OPENUTAU_DIR
      - name: Check the exe starts and every tool schema passes
        run: |
          uv venv -p 3.11 .build\check
          uv pip install -p .build\check "mcp>=1.10,<2"
          .build\check\Scripts\python tests\schema_check.py dist\openutau-mcp.exe
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\openutau-mcp.exe dist\OpenUtauMcp.Plugin.dll dist\SHA256SUMS.txt dist\openutau-mcp-packages.txt dist\GPL-3.0.txt dist\EXE-LICENSE.md --draft --generate-notes
